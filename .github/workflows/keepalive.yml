name: 保持排程啟用

# 公開 repo 若 60 天沒有任何異動，GitHub 會自動停用排程。
# 這個工作每月兩次寫入一個小檔案，讓排程持續運作。
on:
  schedule:
    - cron: "0 2 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push

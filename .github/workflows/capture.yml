name: 氣象截圖

on:
  schedule:
    # GitHub 的排程一律是 UTC 時間，臺北時間 = UTC + 8
    - cron: "40 23 * * *"     # 臺北 07:40（7:30 定時更新後）
    - cron: "45 0 * * *"      # 臺北 08:45
    - cron: "*/15 1-6 * * *"  # 臺北 09:00–14:45 每 15 分鐘（關鍵時段）
    - cron: "45 9 * * *"      # 臺北 17:45（17:30 發布隔日高溫資訊後）
    - cron: "15 11 * * *"     # 臺北 19:15 鄉鎮體感溫度（07–18 時）
    - cron: "55 15 * * *"     # 臺北 23:55 縣市溫度極值（今日）
    - cron: "30 16 * * *"     # 臺北 00:30 縣市溫度極值（昨日，定案版）
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        type: choice
        default: auto
        options: [auto, heat, temptop-today, temptop-yesterday, station, town, probe, purge]
      force:
        description: "忽略「無變化」直接截圖"
        type: boolean
        default: false
      debug:
        description: "把本次輸出推到 probe-results 分支（測試用）"
        type: boolean
        default: false
      probe_urls:
        description: "探勘模式要看的網址（空白分隔，留空則看預設三個網站）"
        type: string
        default: ""
      fake_now:
        description: "測試用假時間（例如 2026-10-03T23:50），正式執行請留空"
        type: string
        default: ""
      purge_day:
        description: "維護用：要清除的日期"
        type: string
        default: ""
      purge_stamp:
        description: "維護用：要刪除的紀錄時間開頭"
        type: string
        default: ""
      purge_paths:
        description: "維護用：要刪除的雲端路徑（以 | 分隔）"
        type: string
        default: ""
      probe_clicks:
        description: "探勘模式開頁後要點擊的元素（CSS，空白分隔）"
        type: string
        default: ""

concurrency:
  group: capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Taipei
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive
      # 測試（debug）時不上傳 Drive，避免測試資料混入正式紀錄
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ !inputs.debug && secrets.GDRIVE_TOKEN || '' }}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      DISTRICT_SCREENSHOTS: ${{ vars.DISTRICT_SCREENSHOTS || 'true' }}
      PROBE_URLS: ${{ inputs.probe_urls }}
      PROBE_CLICKS: ${{ inputs.probe_clicks }}
      CAPTURE_NOW: ${{ inputs.debug && inputs.fake_now || '' }}
      ALLOW_NO_UPLOAD: ${{ inputs.debug && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝 Python 套件
        run: pip install -r requirements.txt

      - name: 安裝中文字型與 rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: 快取瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: 安裝瀏覽器
        run: python -m playwright install --with-deps chromium

      - name: 決定執行模式（依觸發來源，不依實際開始時間，避免排程延遲時做錯事）
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "55 15 * * *") m=temptop-today ;;
            "30 16 * * *") m=temptop-yesterday ;;
            "")            m="${{ inputs.mode || 'auto' }}" ;;
            *)             m=heat ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "觸發：${{ github.event_name }} ${{ github.event.schedule }} → 模式 $m"

      - name: 清除測試紀錄（維護用）
        if: inputs.mode == 'purge'
        env:
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          PURGE_DAY: ${{ inputs.purge_day }}
          PURGE_STAMP: ${{ inputs.purge_stamp }}
          PURGE_PATHS: ${{ inputs.purge_paths }}
        run: python -m capture.maint

      - name: 截圖並上傳 Google Drive
        if: inputs.mode != 'purge'
        run: python -m capture.main --mode "${{ steps.m.outputs.mode }}" ${{ inputs.force && '--force' || '' }}

      - name: 保留本次輸出（失敗或探勘模式時，保存 7 天供除錯）
        if: failure() || inputs.mode == 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.run_id }}
          path: out/
          retention-days: 7

      - name: 測試輸出推到 probe-results 分支
        if: always() && (inputs.mode == 'probe' || inputs.mode == 'purge' || inputs.debug)
        run: |
          mkdir -p /tmp/pr && cp -r out/. /tmp/pr/ && cp -r state /tmp/pr/_state 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/pr/. .
          git add -A
          git commit -m "debug ${{ github.run_id }}"
          git push -f origin probe-results
